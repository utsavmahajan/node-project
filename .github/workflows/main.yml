name: Task1
on: workflow_dispatch
jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - name: Get the Code
              uses: actions/checkout@v3
            - name: Setting Up Node
              uses: actions/setup-node@v3
              with:
                node-version: 20
            - name: Download Dependencies
              run: npm ci
            - name: Running Lint Command
              run: npm run lint:fix
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Get the Code
              uses: actions/checkout@v3
            - name: Setting Up Node
              uses: actions/setup-node@v3
              with:
                node-version: 20
            - name: Download Dependencies
              run: npm ci
            - name: Running Lint Command
              run: npm test
    deploy:
        needs: [lint,test]
        runs-on: ubuntu-latest
        steps:
            - name: Get the Code
              uses: actions/checkout@v3
            - name: Setting Up Node
              uses: actions/setup-node@v3
              with:
                node-version: 20
            - name: Download Dependencies
              run: npm ci
            - name: Running Lint Command
              run: echo "Test And Lint Successful Deploying the Project in 1..2..3.."


